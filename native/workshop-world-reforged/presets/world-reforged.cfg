# OpenMW 0.51.0 only. World Reforged candidate preset; this is a cap, not an FPS guarantee.
# Story, NPC, quest and economy records are unchanged by this settings file.

[Camera]
viewing distance = 49152
field of view = 70

[Video]
resolution x = 2560
resolution y = 1440
window mode = 1
antialiasing = 4
vsync mode = 1
framerate limit = 120

[General]
anisotropy = 16
texture mipmap = linear

[Terrain]
distant terrain = true
object paging = true

[Fog]
use distant fog = true

[Water]
shader = true
refraction = true
rtt size = 1024
reflection detail = 2

[Shadows]
enable shadows = true
shadow map resolution = 4096
number of shadow maps = 3
maximum shadow map distance = 16384
actor shadows = true
player shadows = true
terrain shadows = true
object shadows = true

[Navigator]
async nav mesh updater threads = 4

[Physics]
async num threads = 2

[Sound]
master volume = 1.0
music volume = 0.5
voice volume = 0.85
sfx volume = 0.85
