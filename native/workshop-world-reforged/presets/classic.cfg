# OpenMW 0.51.0 only. Candidate graphics preset, not an FPS guarantee.
# Story, NPC and economy records are unchanged by this settings file.

[Camera]
viewing distance = 7168
field of view = 70

[Video]
resolution x = 2560
resolution y = 1440
window mode = 1
antialiasing = 2
vsync mode = 1
framerate limit = 120

[General]
anisotropy = 16
texture mipmap = linear

[Terrain]
distant terrain = false
object paging = true

[Fog]
use distant fog = false

[Water]
shader = false
refraction = false
rtt size = 512
reflection detail = 2

[Shadows]
enable shadows = false
shadow map resolution = 1024
number of shadow maps = 3
maximum shadow map distance = 8192
actor shadows = false
player shadows = false
terrain shadows = false
object shadows = false

[Navigator]
async nav mesh updater threads = 4

[Physics]
async num threads = 2

[Sound]
master volume = 1.0
music volume = 0.5
voice volume = 0.85
sfx volume = 0.85
