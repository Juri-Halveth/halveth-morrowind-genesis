name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests without game or model
        run: python -m unittest discover -s tests -v
      - name: Validate distributable files
        run: python scripts/build_release.py --check
      - name: Build and verify source archive
        run: python scripts/build_release.py

  public-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install icon conversion dependency
        run: python -m pip install Pillow==12.3.0
      - name: Build public setup without game or OpenMW
        run: python installer/build_installer.py
      - name: Verify embedded setup manifest and source congruence
        run: python tests/verify_public_installer.py
