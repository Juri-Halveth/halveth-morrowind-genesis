name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests without game or model
        run: python -m unittest discover -s tests -v
      - name: Check the optional entity identity experiment
        if: matrix.python == '3.13' && hashFiles('experiments/entity-life/0.1.0/test_registry.py') != ''
        run: python -m unittest discover -s experiments/entity-life/0.1.0 -v
      - name: Exercise book practice callbacks without game data
        if: runner.os == 'Linux' && matrix.python == '3.13'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lua5.1
          lua5.1 tests/multiskill_practice.lua
          lua5.1 tests/game_reply.lua
      - name: Build and test the optional native Workshop with synthetic data
        if: runner.os == 'Windows' && matrix.python == '3.13' && hashFiles('native/workshop-world-reforged/test_candidate.py') != ''
        run: python native/workshop-world-reforged/test_candidate.py
      - name: Validate distributable files
        run: python scripts/build_release.py --check
      - name: Build and verify source archive
        run: python scripts/build_release.py

  public-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install icon conversion dependency
        run: python -m pip install Pillow==12.3.0
      - name: Build public setup without game or OpenMW
        run: python installer/build_installer.py
      - name: Verify embedded setup manifest and source congruence
        run: python tests/verify_public_installer.py
